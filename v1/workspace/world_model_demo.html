<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>World Model Prediction Demo</title>
<style>
  body { margin:0; overflow:hidden; background:#111; color:#fff; font-family:sans-serif; }
  #canvas { display:block; }
  #info { position:absolute; top:10px; left:10px; background:rgba(0,0,0,0.5); padding:5px 10px; border-radius:4px; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="info">World Model Prediction Demo</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
function resize(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

// Draw a simple grid background
function drawGrid(){
  const gridSize = 50;
  ctx.strokeStyle = 'rgba(255,255,255,0.1)';
  ctx.lineWidth = 1;
  for(let x=0;x<canvas.width;x+=gridSize){
    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x,canvas.height);
    ctx.stroke();
  }
  for(let y=0;y<canvas.height;y+=gridSize){
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(canvas.width,y);
    ctx.stroke();
  }
}

let agent = { x: 100, y: canvas.height/2, vx: 2, radius: 10 };
let predictions = [];
let frame = 0;

function update(){
  agent.x += agent.vx;
  if(agent.x > canvas.width + agent.radius) agent.x = -agent.radius;
  // generate predictions for next 60 frames
  predictions = [];
  for(let i=1;i<=60;i++){
    predictions.push({ x: agent.x + i*agent.vx, y: agent.y });
  }
  frame++;
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawGrid();
  // draw prediction line
  ctx.strokeStyle = 'rgba(255,255,0,0.6)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(agent.x, agent.y);
  predictions.forEach(p=> ctx.lineTo(p.x, p.y));
  ctx.stroke();
  // draw predictions as fading circles
  predictions.forEach((p,i)=>{
    const alpha = 1 - i/predictions.length;
    ctx.fillStyle = `rgba(255,255,0,${alpha})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, agent.radius, 0, Math.PI*2);
    ctx.fill();
  });
  // draw true agent
  ctx.fillStyle = '#0f0';
  ctx.beginPath();
  ctx.arc(agent.x, agent.y, agent.radius, 0, Math.PI*2);
  ctx.fill();
  // update info overlay
  document.getElementById('info').textContent = `Frame ${frame} – Agent at (${Math.round(agent.x)}, ${Math.round(agent.y)})`;
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
