<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Interstellar‑Style Black Hole Demo</title>
<style>
  body { margin:0; overflow:hidden; background:#000; color:#fff; font-family:sans-serif; }
  #canvas { display:block; }
  #info { position:absolute; top:10px; left:10px; background:rgba(0,0,0,0.5); padding:5px 10px; border-radius:4px; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="info">Interstellar Black Hole Demo</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
function resize(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

// ---------- Star field (background) ----------
const stars = [];
function initStars(){
  const count = 300;
  for(let i=0;i<count;i++){
    stars.push({
      x: Math.random()*canvas.width,
      y: Math.random()*canvas.height,
      radius: Math.random()*1.5+0.5,
      alpha: Math.random()*0.5+0.5
    });
  }
}
initStars();
function drawStars(){
  ctx.fillStyle = '#fff';
  stars.forEach(s=>{
    ctx.globalAlpha = s.alpha;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.radius, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

// ---------- Particle (accretion flow) ----------
class Particle {
  constructor(){
    this.reset();
  }
  reset(){
    // start at random radius outside the event horizon
    const minR = 80;
    const maxR = Math.min(canvas.width,canvas.height)/2 - 20;
    this.r = Math.random()*(maxR-minR)+minR;
    this.theta = Math.random()*Math.PI*2;
    // give a small tangential velocity to create a swirling motion
    const speed = 0.5 + Math.random()*0.5;
    this.vr = 0; // radial speed will be pulled inward by gravity
    this.vtheta = speed / this.r; // angular speed (rad/frame)
    this.life = Math.random()*200 + 100;
    this.updateCartesian();
  }
  updateCartesian(){
    const cx = canvas.width/2, cy = canvas.height/2;
    this.x = cx + Math.cos(this.theta)*this.r;
    this.y = cy + Math.sin(this.theta)*this.r;
  }
  update(){
    const cx = canvas.width/2, cy = canvas.height/2;
    const dx = cx - this.x;
    const dy = cy - this.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    // simple Newtonian gravity (inverse square) pulling radially
    const grav = 3000 / (dist*dist + 100);
    this.vr += grav; // increase radial inward speed
    // update polar coordinates
    this.r -= this.vr;
    this.theta += this.vtheta;
    this.updateCartesian();
    this.life--;
    if(this.life<=0 || this.r<30){ this.reset(); }
  }
  draw(){
    const alpha = Math.max(0, this.life/300);
    ctx.fillStyle = `rgba(255,200,150,${alpha})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, 2, 0, Math.PI*2);
    ctx.fill();
  }
}

const particles = [];
for(let i=0;i<800;i++) particles.push(new Particle());

// ---------- Accretion Disk ----------
function drawAccretionDisk(){
  const cx = canvas.width/2, cy = canvas.height/2;
  const inner = 40, outer = 120;
  const grad = ctx.createRadialGradient(cx, cy, inner, cx, cy, outer);
  grad.addColorStop(0, 'rgba(255,140,0,0.9)');
  grad.addColorStop(0.5, 'rgba(255,70,0,0.6)');
  grad.addColorStop(1, 'rgba(255,20,0,0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx, cy, outer, 0, Math.PI*2);
  ctx.arc(cx, cy, inner, Math.PI*2, 0, true);
  ctx.fill();
}

// ---------- Black Hole (event horizon + lensing) ----------
function drawBlackHole(){
  const cx = canvas.width/2, cy = canvas.height/2;
  const radius = 30;
  // gravitational lensing: draw a faint warped ring
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(cx, cy, radius*3, 0, Math.PI*2);
  ctx.stroke();
  // inner glow
  const grad = ctx.createRadialGradient(cx, cy, radius, cx, cy, radius*5);
  grad.addColorStop(0, 'rgba(0,0,0,0.9)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx, cy, radius*5, 0, Math.PI*2);
  ctx.fill();
  // event horizon
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI*2);
  ctx.fill();
}

let frame = 0;
function loop(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawStars();
  drawAccretionDisk();
  particles.forEach(p=>{ p.update(); p.draw(); });
  drawBlackHole();
  document.getElementById('info').textContent = `Frame ${frame}`;
  frame++;
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
