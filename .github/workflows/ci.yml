name: CI

on:
  push:
    branches: [production]
  pull_request:
    branches: [production]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      # This job runs with ELIA_DAEMON unset (i.e. "off"), so the whole suite
      # here is also the proof that everything works on the pure-TS path.
      - name: Test
        env:
          ELIA_API_KEY: ci-test-placeholder
        # --timeout: the few tests that stand up a real localhost server / fs.watch
        # / git+gh subprocess need more than bun's 5s default on a 2-core runner.
        # --retry: a handful of Ink-render and WebSocket tests use fixed short
        # sleeps to let async work settle; those occasionally lose the race under
        # CI load. A real regression still fails all three attempts.
        run: bun test --timeout=20000 --retry=2
      - name: Secret scan
        run: bun run security:scan
      - name: Pack without lifecycle scripts
        run: npm pack --ignore-scripts --json > /tmp/elia-pack.json
      - name: Audit production dependency graph
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev
          rm -f package-lock.json

  # The native systems layer (crates/): the `eliad` daemon and `elia-native`, the
  # in-process structural-check library the TS side dlopen's via bun:ffi. Kept
  # separate so a Rust toolchain problem never blocks the TS suite, and vice versa.
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests (compiles the elia-parse C++; MCP test needs bun on PATH)
        run: cargo test --workspace
      - name: Build elia-jvm-bridge
        run: |
          cd jvm/elia-jvm-bridge
          mkdir -p build/classes
          javac -d build/classes $(find src -name '*.java')
          jar --create --file build/elia-jvm-bridge.jar \
            --main-class com.elia.jvmbridge.Bridge -C build/classes .
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: In-process native check (bun:ffi → elia-native cdylib)
        # Builds the cdylib so `src/native/ffi.ts` finds it in target/release and
        # the `withNative` tests run instead of skipping. Daemon left off — this
        # path is meant to work without it.
        run: |
          cargo build -p elia-native --release
          bun test src/native/ --timeout=20000
      - name: Daemon-backed TypeScript tests (shell + C++ parse + JVM check + MCP)
        env:
          ELIA_DAEMON: auto
        # Build the daemon first so `resolveEliadPath()` finds it and the
        # end-to-end tests run instead of skipping.
        run: |
          cargo build -p eliad
          bun test src/daemon/ --timeout=40000
