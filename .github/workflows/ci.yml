name: CI

on:
  push:
    branches: [production]
  pull_request:
    branches: [production]

permissions:
  contents: read

jobs:
  verify:
    # Windows is a first-class target (runShell's %ComSpec% path, taskkill /T tree
    # kill, CRLF output bounds, Windows-path resolution) and ~20 source files carry
    # a `process.platform === 'win32'` branch. Run the TS suite on both so those
    # paths — and the win32-only tests that `test.if` skips on Linux — are covered.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      # This job runs with ELIA_DAEMON unset (i.e. "off"), so the whole suite
      # here is also the proof that everything works on the pure-TS path.
      - name: Test
        env:
          ELIA_API_KEY: ci-test-placeholder
        # --timeout: the few tests that stand up a real localhost server / fs.watch
        # / git+gh subprocess need more than bun's 5s default on a 2-core runner.
        # --retry: a handful of Ink-render and WebSocket tests use fixed short
        # sleeps to let async work settle; those occasionally lose the race under
        # CI load. A real regression still fails all three attempts.
        run: bun test --timeout=20000 --retry=2
      - name: Secret scan
        run: bun run security:scan
      # Packaging checks are OS-independent — run them once, on Linux (the `/tmp`
      # path and shell here assume a POSIX runner).
      - name: Pack without lifecycle scripts
        if: matrix.os == 'ubuntu-latest'
        run: npm pack --ignore-scripts --json > /tmp/elia-pack.json
      - name: Audit production dependency graph
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev
          rm -f package-lock.json

  # The native systems layer (crates/): the `eliad` daemon and `elia-native`, the
  # in-process structural-check library the TS side dlopen's via bun:ffi. Kept
  # separate so a Rust toolchain problem never blocks the TS suite, and vice versa.
  #
  # Runs on Windows too, same as `go` and `verify`. It used to be ubuntu-only,
  # and that is exactly how the template-literal bug in elia-parse's C++ lexer
  # shipped: `src/native/ffi.ts` only loads the cdylib when one has been built
  # locally, so a developer machine that ran `cargo build` had the checker live
  # and blocking writes while CI never loaded it at all. The lexer is
  # platform-independent, but the thing that decides whether it *runs* is not.
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      # Lint is platform-independent - run it once, on Linux.
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests (compiles the elia-parse C++; MCP test needs bun on PATH)
        run: cargo test --workspace
      - name: Build elia-jvm-bridge
        shell: bash
        run: |
          cd jvm/elia-jvm-bridge
          mkdir -p build/classes
          javac -d build/classes $(find src -name '*.java')
          jar --create --file build/elia-jvm-bridge.jar \
            --main-class com.elia.jvmbridge.Bridge -C build/classes .
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: In-process native check (bun:ffi → elia-native cdylib)
        shell: bash
        # Builds the cdylib so `src/native/ffi.ts` finds it in target/release and
        # the `withNative` tests run instead of skipping. Daemon left off — this
        # path is meant to work without it.
        run: |
          cargo build -p elia-native --release
          bun test src/native/ --timeout=20000
      # The structural check gates every write, so a false rejection blocks the
      # agent outright rather than merely reporting something. With the cdylib
      # built above, run the write-path tests against it on both platforms.
      - name: Write path with the structural check live
        shell: bash
        run: bun test src/tools/editFile.test.ts src/tools/editMatch.test.ts src/tools/atomicWrite.test.ts --timeout=20000
      - name: Daemon-backed TypeScript tests (shell + C++ parse + JVM check + MCP)
        shell: bash
        env:
          ELIA_DAEMON: auto
        # Build the daemon first so `resolveEliadPath()` finds it and the
        # end-to-end tests run instead of skipping.
        run: |
          cargo build -p eliad
          bun test src/daemon/ --timeout=40000

  # The Go sidecar pilot (go/elia-index). Kept separate so a Go toolchain
  # problem never blocks the TS suite, and vice versa — same split as `native`.
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          # No external Go dependencies yet (stdlib only, no go.sum) — nothing to cache.
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - name: Format check
        working-directory: go
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Vet
        working-directory: go
        run: go vet ./...
      - name: Go tests
        working-directory: go
        run: go test ./...
      - name: Build elia-index
        working-directory: go
        shell: bash
        # -o keeps the exact name on every OS, so add .exe on Windows to match
        # what resolveGoIndexPath() looks for.
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then EXT=.exe; fi
          go build -o "bin/elia-index$EXT" ./cmd/elia-index
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Go-backed TypeScript tests (sidecar + grep parity)
        env:
          ELIA_GO_INDEX: auto
        run: |
          bun test src/goindex/ --timeout=20000 --retry=2
          bun test src/tools/tools.test.ts src/tools/ignoreDirs.test.ts --timeout=20000 --retry=2
