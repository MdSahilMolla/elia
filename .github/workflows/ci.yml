name: CI

on:
  push:
    branches: [master, manus]
  pull_request:
    branches: [master, manus]

permissions:
  contents: read

jobs:
  verify-v2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        env:
          ELIA_API_KEY: ci-test-placeholder
        run: bun test
      - name: Secret scan
        run: bun run security:scan
      - name: Pack without lifecycle scripts
        run: npm pack --ignore-scripts --json > /tmp/elia-pack.json
      - name: Audit production dependency graph
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev
          rm -f package-lock.json
