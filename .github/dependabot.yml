version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: production
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    ignore:
      # Pinned: 0.25+ cannot load the tree-sitter-wasms grammars, so a bump has
      # to replace the grammar source too. See src/goindex/symbolIndex.ts.
      - dependency-name: web-tree-sitter
  - package-ecosystem: github-actions
    directory: /
    target-branch: production
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
