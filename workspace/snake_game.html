<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake Game</title>
  <style>
    body { margin:0; display:flex; justify-content:center; align-items:center; height:100vh; background:#111; }
    canvas { background:#222; display:block; }
    #overlay { position:absolute; top:0; left:0; right:0; bottom:0; display:flex; flex-direction:column; justify-content:center; align-items:center; background:rgba(0,0,0,0.7); color:#fff; font-family:sans-serif; visibility:hidden; }
    #overlay.visible { visibility:visible; }
    button { margin-top:10px; padding:5px 10px; }
  </style>
</head>
<body>
  <canvas id="game" width="400" height="400"></canvas>
  <div id="overlay"><h2>Game Over</h2><button id="restart">Restart</button></div>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const grid = 20;
    const cols = canvas.width / grid;
    const rows = canvas.height / grid;
    const overlay = document.getElementById('overlay');
    const restartBtn = document.getElementById('restart');

    let snake = []; // array of {x,y} grid cells
    let prevSnake = [];
    let dir = {x:1, y:0};
    let food = {x:0, y:0};
    let speed = 5; // cells per second
    let progress = 0; // 0..1 between steps
    let lastTime = 0;
    let running = true;
    let score = 0;

    function randomFood(){
      return {x: Math.floor(Math.random()*cols), y: Math.floor(Math.random()*rows)};
    }

    function reset(){
      snake = [{x:5, y:5}];
      prevSnake = [{x:5, y:5}];
      dir = {x:1, y:0};
      food = randomFood();
      speed = 5;
      progress = 0;
      lastTime = 0;
      running = true;
      score = 0;
      overlay.classList.remove('visible');
    }

    function end(){
      running = false;
      overlay.classList.add('visible');
    }

    function step(){
      // store previous positions
      prevSnake = snake.map(p=>({x:p.x, y:p.y}));
      // compute new head
      const head = {
        x: (snake[0].x + dir.x + cols) % cols,
        y: (snake[0].y + dir.y + rows) % rows
      };
      // check self collision
      if(snake.some(s=> s.x===head.x && s.y===head.y)){
        end();
        return;
      }
      snake.unshift(head);
      // eat food
      if(head.x===food.x && head.y===food.y){
        food = randomFood();
        speed += 0.5;
        score++;
      } else {
        snake.pop();
      }
    }

    function draw(){
      // clear
      ctx.fillStyle = '#222';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      // draw food
      ctx.fillStyle = '#f00';
      ctx.fillRect(food.x*grid, food.y*grid, grid, grid);
      // draw snake with interpolation
      ctx.fillStyle = '#0f0';
      for(let i=0;i<snake.length;i++){
        const cur = snake[i];
        const prev = prevSnake[i] || cur; // for new tail, use current
        const ix = prev.x + (cur.x - prev.x) * progress;
        const iy = prev.y + (cur.y - prev.y) * progress;
        ctx.fillRect(ix*grid, iy*grid, grid, grid);
      }
    }

    function loop(time){
      if(!running) return;
      const delta = time - lastTime;
      lastTime = time;
      // progress accumulates based on speed (cells per second)
      progress += delta * speed / 1000;
      while(progress >= 1){
        progress -= 1;
        step();
        if(!running) break;
      }
      draw();
      requestAnimationFrame(loop);
    }

    document.addEventListener('keydown', e=>{
      if(e.key==='ArrowUp' && dir.y===0) dir={x:0,y:-1};
      else if(e.key==='ArrowDown' && dir.y===0) dir={x:0,y:1};
      else if(e.key==='ArrowLeft' && dir.x===0) dir={x:-1,y:0};
      else if(e.key==='ArrowRight' && dir.x===0) dir={x:1,y:0};
    });
    restartBtn.addEventListener('click', reset);
    reset();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
