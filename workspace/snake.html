<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1220;
      --panel: #171b2e;
      --accent: #59e6a0;
      --accent-2: #ff5d6c;
      --text: #eef0fb;
      --text-dim: #9aa0c3;
      --board: #171b2e;
      --grid-line: rgba(255, 255, 255, 0.04);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: radial-gradient(circle at 50% 0%, #1b2040 0%, var(--bg) 60%);
      font-family: 'Manrope', system-ui, sans-serif;
      color: var(--text);
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .subtitle {
      margin-top: -10px;
      font-size: 13px;
      color: var(--text-dim);
      font-weight: 500;
    }

    .stage {
      position: relative;
      border-radius: 20px;
      padding: 10px;
      background: linear-gradient(180deg, var(--panel), #12162a);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45), inset 0 0 0 1px rgba(255, 255, 255, 0.06);
    }

    canvas {
      display: block;
      border-radius: 14px;
      background: var(--board);
    }

    .hud {
      position: absolute;
      top: 26px;
      left: 26px;
      display: flex;
      align-items: baseline;
      gap: 6px;
      font-weight: 700;
      font-size: 20px;
    }

    .hud small {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .overlay {
      position: absolute;
      inset: 10px;
      border-radius: 14px;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: rgba(10, 12, 24, 0.78);
      backdrop-filter: blur(3px);
      text-align: center;
      padding: 24px;
    }

    .overlay.visible { display: flex; }

    .overlay h2 {
      margin: 0;
      font-size: 26px;
      font-weight: 800;
    }

    .overlay .score-line {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    button {
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      color: #0a2015;
      background: var(--accent);
      border: none;
      border-radius: 999px;
      padding: 10px 22px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 8px 20px rgba(89, 230, 160, 0.3);
    }

    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(0); }

    .controls {
      display: flex;
      gap: 14px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
    }

    .controls kbd {
      font-family: inherit;
      background: var(--panel);
      border-radius: 6px;
      padding: 3px 7px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <h1>Snake</h1>
  <div class="subtitle">Eat, grow, don't bite yourself.</div>

  <div class="stage">
    <canvas id="game" width="400" height="400"></canvas>
    <div class="hud"><small>Score</small><span id="scoreValue">0</span></div>
    <div class="overlay" id="gameOverOverlay">
      <h2>Game Over</h2>
      <div class="score-line">Final score: <span id="finalScore">0</span></div>
      <button id="restartBtn">Restart</button>
    </div>
  </div>

  <div class="controls">
    <span><kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&larr;</kbd><kbd>&rarr;</kbd> Move</span>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const grid = 20; // size of each cell
    const countX = canvas.width / grid;
    const countY = canvas.height / grid;
    const scoreValueEl = document.getElementById('scoreValue');
    const finalScoreEl = document.getElementById('finalScore');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const restartBtn = document.getElementById('restartBtn');

    let snake = [{x: 5, y:5}];
    let dir = {x:1, y:0};
    let food = {x:10, y:10};
    let speed = 5; // moves per second
    let lastTime = 0;
    let score = 0;
    let running = true;

    function drawGrid() {
      ctx.strokeStyle = '#1f2440';
      ctx.lineWidth = 1;
      for (let x = 1; x < countX; x++) {
        ctx.beginPath();
        ctx.moveTo(x * grid, 0);
        ctx.lineTo(x * grid, canvas.height);
        ctx.stroke();
      }
      for (let y = 1; y < countY; y++) {
        ctx.beginPath();
        ctx.moveTo(0, y * grid);
        ctx.lineTo(canvas.width, y * grid);
        ctx.stroke();
      }
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function reset() {
      snake = [{x:5,y:5}];
      dir = {x:1,y:0};
      speed = 5;
      score = 0;
      running = true;
      scoreValueEl.textContent = '0';
      gameOverOverlay.classList.remove('visible');
    }

    function endGame() {
      running = false;
      finalScoreEl.textContent = score;
      gameOverOverlay.classList.add('visible');
    }

    function loop(time) {
      requestAnimationFrame(loop);
      if (!running) return;
      if ((time - lastTime) < 1000 / speed) return;
      lastTime = time;
      // move snake
      const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
      // wrap around
      head.x = (head.x + countX) % countX;
      head.y = (head.y + countY) % countY;
      // check collision with self
      for (let i=0;i<snake.length;i++) {
        if (snake[i].x===head.x && snake[i].y===head.y) {
          endGame();
          return;
        }
      }
      snake.unshift(head);
      // eat food
      if (head.x===food.x && head.y===food.y) {
        // place new food
        food = {x: Math.floor(Math.random()*countX), y: Math.floor(Math.random()*countY)};
        speed += 0.5; // increase difficulty
        score += 1;
        scoreValueEl.textContent = score;
      } else {
        snake.pop();
      }
      // draw
      ctx.fillStyle = '#171b2e';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      drawGrid();
      // draw food
      ctx.fillStyle = '#ff5d6c';
      roundRect(food.x*grid+1, food.y*grid+1, grid-2, grid-2, 5);
      ctx.fill();
      // draw snake
      snake.forEach((segment, i) => {
        ctx.fillStyle = i === 0 ? '#7ff5c0' : '#59e6a0';
        roundRect(segment.x*grid+1, segment.y*grid+1, grid-2, grid-2, 5);
        ctx.fill();
      });
    }
    requestAnimationFrame(loop);
    // controls
    document.addEventListener('keydown', e => {
      switch(e.key) {
        case 'ArrowUp': if (dir.y===0) dir = {x:0,y:-1}; break;
        case 'ArrowDown': if (dir.y===0) dir = {x:0,y:1}; break;
        case 'ArrowLeft': if (dir.x===0) dir = {x:-1,y:0}; break;
        case 'ArrowRight': if (dir.x===0) dir = {x:1,y:0}; break;
      }
    });
    restartBtn.addEventListener('click', reset);
  </script>
</body>
</html>
