<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="700" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Hero Placeholder</title>
  <desc id="desc">A large rectangular placeholder image with diagonal pattern, labelled as hero placeholder.</desc>
  <defs>
    <pattern id="diagonal" patternUnits="userSpaceOnUse" width="16" height="16" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#eef1f4"/>
      <rect y="7" width="16" height="2" fill="#d9dee3"/>
    </pattern>
  </defs>
  <rect width="1200" height="700" fill="url(#diagonal)"/>
  <rect x="20" y="20" width="1160" height="660" fill="none" stroke="#c7cfd7" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="600" y="350" text-anchor="middle" fill="#7a8794" font-family="Inter, Arial, sans-serif" font-size="28">Placeholder — Hero Image 1200×700</text>
</svg>