<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Simple Note Taker</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; }
        textarea { width: 100%; height: 100px; }
        .note { border: 1px solid #ccc; padding: .5rem; margin-top: .5rem; }
        .timestamp { font-size: .8rem; color: #666; }
    </style>
</head>
<body>
    <h1>Notes</h1>
    <form method="post">
        <textarea name="content" placeholder="Write your note here..." required></textarea><br>
        <button type="submit">Add Note</button>
    </form>
    <hr>
    {% for note in notes %}
    <div class="note">
        <div>{{ note.content|e }}</div>
        <div class="timestamp">{{ note.created_at }}</div>
    </div>
    {% endfor %}
</body>
</html>
